<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORGE TERMINAL</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚒</text></svg>">
<style>
/* ================================================================ tokens (validated dark palette + terminal extensions) */
:root {
  --page:#0d0d0d; --surface:#141413; --panel:#161615; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,.10); --wash:rgba(255,255,255,.03);
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b; --seq:#3987e5;
  --cyan:#35d0e0; --cyan-glow:rgba(53,208,224,.40); --pending:#565650;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"JetBrains Mono","SF Mono",monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 12px/1.45 var(--mono);
  display: grid; grid-template-rows: 40px 22px 34px minmax(0,1fr) 264px;
  overflow: hidden;
}

/* ================================================================ pills & shared chrome */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--ring); border-radius: 3px; padding: 2px 8px;
  font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink-2); white-space: nowrap;
}
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.pill.free    { color: var(--good);    border-color: rgba(12,163,12,.45); }
.pill.busy    { color: var(--cyan);    border-color: rgba(53,208,224,.45); }
.pill.waiting { color: var(--warning); border-color: rgba(250,178,25,.5); }
.pill.off     { color: var(--muted); }
.pill.live .dot { background: var(--good); }
.pill.dead .dot { background: var(--warning); }
.pill.click { cursor: pointer; }
.pill.click:hover { border-color: rgba(255,255,255,.28); }
.spacer { flex: 1; }
button, select, input[type="search"] {
  background: var(--page); color: var(--ink-2); border: 1px solid var(--ring);
  border-radius: 3px; font: 10.5px var(--mono); padding: 3px 8px; min-width: 0;
  text-transform: uppercase; letter-spacing: .05em;
}
input[type="search"] { text-transform: none; letter-spacing: 0; font-size: 11.5px; }
input[type="search"]::placeholder { color: var(--muted); }
button { cursor: pointer; white-space: nowrap; }
button:hover, select:hover, input[type="search"]:hover { border-color: rgba(255,255,255,.25); }
button.on { color: var(--good); border-color: rgba(12,163,12,.4); }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--baseline); border-radius: 4px; border: 2px solid var(--panel); }
::-webkit-scrollbar-track { background: transparent; }

/* ================================================================ top bar */
#topbar {
  display: flex; align-items: center; gap: 8px; padding: 0 12px;
  border-bottom: 1px solid var(--ring); background: var(--surface);
}
.wordmark { font-weight: 700; letter-spacing: .16em; font-size: 13px; white-space: nowrap; }
.wordmark .glyph { margin-right: 6px; }
#runTitle {
  color: var(--ink-2); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 34vw;
}
#timer { color: var(--ink); font-size: 13px; letter-spacing: .08em; white-space: nowrap; }
#sparkWrap { display: flex; align-items: center; gap: 6px; }
#spark { width: 96px; height: 20px; display: block; }
#rateLbl { color: var(--muted); font-size: 10px; white-space: nowrap; }

/* ================================================================ ticker */
#ticker {
  overflow: hidden; border-bottom: 1px solid var(--ring); background: var(--page);
  display: flex; align-items: center; position: relative;
}
#tickerTrack { display: inline-flex; white-space: nowrap; will-change: transform; }
body.anim #tickerTrack.scroll { animation: tick linear infinite; animation-duration: var(--tickdur, 30s); }
@keyframes tick { to { transform: translateX(-50%); } }
.tickseg { padding: 0 18px; color: var(--muted); font-size: 10.5px; letter-spacing: .04em; }
.tickseg .rule { color: var(--cyan); }
.tickseg .warn { color: var(--warning); }
.tickseg .forged { color: var(--ink-2); }
.tickseg .sep { color: var(--baseline); padding: 0 10px; }

/* ================================================================ session chips */
#chips {
  display: flex; align-items: center; gap: 6px; padding: 0 12px;
  border-bottom: 1px solid var(--ring); background: var(--surface);
  overflow-x: auto; scrollbar-width: none;
}
#chips::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none; cursor: pointer;
  border: 1px solid var(--ring); border-radius: 3px; padding: 3px 9px;
  font-size: 10.5px; color: var(--ink-2); letter-spacing: .04em; user-select: none;
}
.chip:hover { border-color: rgba(255,255,255,.28); }
.chip.selected { border-color: var(--cyan); color: var(--ink); }
.chip.dim { opacity: .5; }
.chip .cdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.chip .sid { color: var(--muted); font-size: 9.5px; }
.chip .st { font-size: 10px; }
.chip .attn { color: var(--warning); font-weight: 700; }
.chip.forgecap { color: var(--muted); cursor: default; }
.chip.forgecap:hover { border-color: var(--ring); }

/* ================================================================ board */
#board {
  position: relative; overflow: auto; background: var(--page);
}
#scan {
  position: fixed; pointer-events: none; z-index: 3;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.024) 0 1px, transparent 1px 3px);
  display: none;
}
body.fx #scan { display: block; }
#boardInner { position: relative; min-width: 100%; min-height: 100%; }
#edges { position: absolute; top: 0; left: 0; pointer-events: none; }
#edges path { stroke: var(--grid); stroke-width: 1; fill: none; }
#edges path.chain { opacity: .35; }
#edges path.dep { stroke: var(--baseline); stroke-width: 1.2; }
#edges path.selin { stroke: var(--cyan); opacity: .9; }
#boardEmpty {
  position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px;
  align-items: center; justify-content: center; color: var(--muted);
  font-size: 12px; letter-spacing: .08em; text-transform: uppercase; text-align: center;
  padding: 20px;
}
#boardEmpty .big { font-size: 15px; color: var(--ink-2); }
#boardEmpty .hint { text-transform: none; letter-spacing: 0; color: var(--muted); font-size: 11px; }
.band-header {
  position: absolute; height: 20px; display: flex; align-items: center; gap: 8px;
  font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2);
  border-bottom: 1px solid var(--grid); padding-bottom: 2px; cursor: pointer;
}
.band-header .bar { width: 14px; height: 3px; }
.band-header .meta { color: var(--muted); text-transform: none; letter-spacing: .02em; }
.more-chip {
  position: absolute; display: flex; align-items: center; justify-content: center;
  border: 1px dashed var(--baseline); border-radius: 3px; color: var(--muted);
  font-size: 10px; cursor: pointer; letter-spacing: .06em;
}
.more-chip:hover { color: var(--ink-2); border-color: var(--muted); }

/* task nodes */
.tnode {
  position: absolute; display: flex; align-items: flex-start; gap: 5px;
  background: var(--surface); border: 1px solid var(--pending); border-radius: 3px;
  padding: 4px 7px 4px 6px; cursor: pointer; user-select: none;
  border-left-width: 3px; transition: transform .15s ease, border-color .2s;
  will-change: auto;
}
.tnode .tglyph { flex: none; font-size: 11px; color: var(--muted); line-height: 1.3; }
.tnode .tidx { flex: none; font-size: 8.5px; color: var(--muted); line-height: 1.5; opacity: .8; }
.tnode .tsub {
  font-size: 10px; line-height: 1.32; color: var(--ink-2); overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word;
}
.tnode.st-in_progress { border-color: var(--cyan); }
.tnode.st-in_progress .tglyph { color: var(--cyan); }
.tnode.st-in_progress .tsub { color: var(--ink); }
body.anim .tnode.st-in_progress::after {
  content: ""; position: absolute; inset: -1px; border-radius: 3px; pointer-events: none;
  box-shadow: 0 0 9px var(--cyan-glow), inset 0 0 5px rgba(53,208,224,.12);
  animation: nodepulse 2.4s ease-in-out infinite;
}
@keyframes nodepulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
.tnode.st-completed { border-color: var(--good); }
.tnode.st-completed .tglyph { color: var(--good); }
.tnode.st-completed .tsub { color: var(--muted); }
.tnode.failed { border-color: var(--critical); }
.tnode.failed .tglyph { color: var(--critical); }
.tnode.rule { border-style: solid; }
.tnode.rule .tglyph { color: var(--cyan); }
.tnode.rule::before {
  content: ""; position: absolute; top: -1px; left: -3px; width: 7px; height: 7px; pointer-events: none;
  border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan);
}
.tnode.stubbed .tsub { font-style: italic; }
.tnode.sel { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan); }
.tnode.sel .tsub { color: var(--ink); }
.tnode.compact { padding: 2px 6px 2px 5px; }
.tnode.compact .tsub { -webkit-line-clamp: 1; font-size: 9px; }
.tnode.summary { border-style: dashed; border-color: var(--good); justify-content: center; align-items: center; cursor: default; }
.tnode.summary .tsub { color: var(--good); -webkit-line-clamp: 1; }

/* ================================================================ bottom panels */
#bottom {
  display: grid; grid-template-columns: clamp(340px, 28vw, 460px) minmax(0,1fr); gap: 10px;
  padding: 10px 12px 12px; min-height: 0; background: var(--page); border-top: 1px solid var(--ring);
}
.bpanel {
  background: var(--panel); border: 1px solid var(--ring); border-radius: 4px;
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
}
.bhead {
  display: flex; align-items: center; gap: 8px; padding: 5px 10px; flex: none;
  border-bottom: 1px solid var(--ring); font-size: 10px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-2);
}
.bbody { flex: 1; overflow-y: auto; min-height: 0; }

/* inspector */
#insp { padding: 10px 12px; }
#insp .empty { color: var(--muted); font-size: 11px; letter-spacing: .04em; padding-top: 16px; text-align: center; }
#insp .isub { font-size: 12px; color: var(--ink); line-height: 1.4; word-break: break-word; margin-bottom: 4px; }
#insp .isub .tg { margin-right: 6px; }
#insp .irow { display: flex; gap: 8px; font-size: 10.5px; margin: 2px 0; }
#insp .irow .k { color: var(--muted); flex: none; width: 76px; text-transform: uppercase; letter-spacing: .06em; font-size: 9.5px; padding-top: 1px; }
#insp .irow .v { color: var(--ink-2); word-break: break-word; min-width: 0; }
#insp .tag { display: inline-block; border: 1px solid var(--ring); border-radius: 2px; font-size: 8.5px; padding: 0 4px; margin-left: 6px; color: var(--warning); vertical-align: 1px; }
#insp .tag.rule { color: var(--cyan); }
#insp .sect { margin-top: 10px; padding-top: 7px; border-top: 1px solid var(--grid); }
#insp .sect > .st { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
#insp .hrow { display: flex; gap: 8px; font-size: 10.5px; padding: 1px 0; cursor: pointer; color: var(--ink-2); }
#insp .hrow:hover { color: var(--ink); }
#insp .hrow .t { color: var(--muted); }
#insp .dep-chip { display: inline-flex; gap: 4px; border: 1px solid var(--ring); border-radius: 2px; padding: 0 5px; margin: 1px 3px 1px 0; font-size: 10px; cursor: pointer; color: var(--ink-2); }
#insp .dep-chip:hover { border-color: var(--muted); }
#insp .erow { display: flex; gap: 7px; font-size: 10.5px; padding: 1.5px 0; cursor: pointer; min-width: 0; }
#insp .erow:hover { background: var(--wash); }
#insp .erow .t { color: var(--muted); flex: none; }
#insp .erow .m { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#insp .foot { display: flex; gap: 8px; margin-top: 10px; }
.schip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--ring); border-radius: 2px; padding: 1px 6px; font-size: 10px; cursor: pointer; color: var(--ink-2); }
.schip .cdot { width: 7px; height: 7px; border-radius: 50%; }

/* log */
#logHead { gap: 6px; }
#logHead input[type="search"] { flex: 1; }
#logHead select { max-width: 130px; }
#log { padding: 3px 0 6px; }
.row {
  display: grid; grid-template-columns: 62px 118px minmax(0,1fr); gap: 8px;
  padding: 2.5px 10px; align-items: baseline; cursor: pointer;
}
body.anim .row.fresh { animation: flash .8s ease-out; }
@keyframes flash { from { background: rgba(255,255,255,.07); } to { background: transparent; } }
.row:hover { background: var(--wash); }
.row .t { color: var(--muted); font-size: 10px; }
.row .who { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
.row .sdot { width: 7px; height: 7px; border-radius: 50%; flex: none; align-self: center; }
.row .app { color: var(--ink-2); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .what { min-width: 0; display: flex; gap: 7px; align-items: baseline; }
.badge {
  flex: none; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
  border: 1px solid var(--ring); border-radius: 2px; padding: 0 5px; line-height: 14px;
}
.badge.fail { color: var(--critical); border-color: rgba(208,59,59,.45); }
.badge.attn { color: var(--warning); border-color: rgba(250,178,25,.45); }
.badge.task { color: var(--cyan); border-color: rgba(53,208,224,.35); }
.badge.forge { color: var(--ink-2); border-color: rgba(255,255,255,.25); }
.row .msg { color: var(--ink); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .msg .dim { color: var(--muted); }
.row .msg b { font-weight: 600; }

/* ================================================================ modal + tooltip */
#tip {
  position: fixed; z-index: 30; pointer-events: none; display: none; max-width: 340px;
  background: #1e1e1d; border: 1px solid rgba(255,255,255,.14); border-radius: 3px;
  padding: 7px 10px; font-size: 11px; color: var(--ink-2); box-shadow: 0 6px 24px rgba(0,0,0,.5);
}
#overlay {
  position: fixed; inset: 0; z-index: 40; display: none;
  background: rgba(0,0,0,.62); align-items: center; justify-content: center;
}
#overlay.open { display: flex; }
#modal {
  background: var(--panel); border: 1px solid rgba(255,255,255,.14); border-radius: 4px;
  width: min(760px, 92vw); max-height: 84vh; display: flex; flex-direction: column;
  box-shadow: 0 12px 48px rgba(0,0,0,.6);
}
#modal .mhead { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--ring); flex: none; }
#modal .mtitle { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#modal .mbody { overflow-y: auto; padding: 12px 14px; min-height: 0; }
#modal pre { margin: 0; font: 10.5px/1.55 var(--mono); color: var(--ink-2); white-space: pre-wrap; word-break: break-word; }
.turn { margin-bottom: 13px; }
.turn .role { font-size: 9.5px; font-weight: 700; letter-spacing: .1em; color: var(--muted); margin-bottom: 2px; }
.turn.user .role { color: var(--ink-2); }
.turn .text { color: var(--ink-2); font-size: 11.5px; white-space: pre-wrap; word-break: break-word; }
.turn.user .text { color: var(--ink); }
.regrow { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--grid); font-size: 11px; }
.regrow .rid { color: var(--cyan); flex: none; width: 120px; }
.regrow .rtype { color: var(--muted); flex: none; width: 46px; text-transform: uppercase; font-size: 9.5px; padding-top: 2px; }
.regrow .rdesc { color: var(--ink-2); }
.regrow .rdesc .inv { color: var(--muted); display: block; margin-top: 2px; }

/* ================================================================ motion / fx ladder */
@media (prefers-reduced-motion: reduce) {
  body.anim #tickerTrack.scroll, body.anim .tnode.st-in_progress::after, body.anim .row.fresh { animation: none !important; }
  .tnode { transition: none; }
}
@media (forced-colors: active) {
  .tnode { box-shadow: none !important; }
  body.fx #scan { display: none; }
}

/* ================================================================ narrow */
@media (max-width: 1100px) {
  #bottom { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  #inspPanel { position: fixed; left: 0; top: 96px; bottom: 0; width: 340px; z-index: 20; display: none; border-radius: 0 4px 0 0; }
  #inspPanel.open { display: flex; }
}
@media (max-width: 820px) {
  #runTitle { display: none; }
  #sparkWrap { display: none; }
}
</style>
</head>
<body class="fx anim">

<div id="topbar">
  <div class="wordmark"><span class="glyph">⚒</span>FORGE</div>
  <span class="pill">Terminal</span>
  <span class="pill off" id="linePill">LINE: —</span>
  <span class="pill dead" id="livePill"><span class="dot"></span><span id="liveTxt">CONNECTING</span></span>
  <span id="runTitle">ALL SESSIONS</span>
  <span class="spacer"></span>
  <span id="timer">T+00:00:00</span>
  <span id="sparkWrap"><svg id="spark" viewBox="0 0 96 20" preserveAspectRatio="none"></svg><span id="rateLbl">0/m</span></span>
  <span class="pill" id="agentsPill">AGENTS 0</span>
  <span class="pill click" id="forgedPill">FORGED 0</span>
  <span class="pill click" id="fxPill">FX</span>
</div>

<div id="ticker"><div id="tickerTrack"></div></div>

<div id="chips"></div>

<div id="board">
  <div id="boardInner">
    <svg id="edges"></svg>
    <div id="boardEmpty">
      <div class="big">AWAITING AGENTS…</div>
      <div>machine-wide hooks armed · run claude in any project</div>
      <div class="hint">tip: /forge-plan &lt;goal&gt; fills this board with a build pipeline</div>
    </div>
  </div>
  <div id="scan"></div>
</div>

<div id="bottom">
  <div class="bpanel" id="inspPanel">
    <div class="bhead"><span>Selected node</span><span class="spacer"></span><button id="inspClose" style="display:none">✕</button></div>
    <div class="bbody" id="insp"><div class="empty">Select a node to inspect it.</div></div>
  </div>
  <div class="bpanel">
    <div class="bhead" id="logHead">
      <span>Live log</span>
      <input type="search" id="fSearch" placeholder="search events (tool, file, prompt…)">
      <select id="fSession"><option value="">ALL SESSIONS</option></select>
      <select id="fApp"><option value="">ALL APPS</option></select>
      <select id="fType"><option value="">ALL EVENTS</option></select>
      <button id="btnLive" class="on">● LIVE</button>
      <button id="btnClear">CLR</button>
    </div>
    <div class="bbody" id="log" role="table" aria-label="Event log"></div>
  </div>
</div>

<div id="tip"></div>
<div id="overlay">
  <div id="modal">
    <div class="mhead"><span class="mtitle" id="modalTitle"></span><span class="spacer"></span><button id="modalClose">✕ CLOSE</button></div>
    <div class="mbody" id="modalBody"></div>
  </div>
</div>

<script>
"use strict";
/* ================================================================ constants */
const CAT = ["#3987e5","#199e70","#c98500","#008300","#9085e9","#e66767","#d55181","#d95926"];
const OVERFLOW = "#898781";
const ACTIVE_MS = 45000, EVICT_MS = 3 * 60000, STALE_MS = 10 * 60000, BUSY_TOOL_MS = 10 * 60000;
const NODELESS = new Set(["ForgeBuild", "Unknown"]);
const TASK_TOOLS = new Set(["TaskCreate", "TaskUpdate", "TaskList", "TaskGet"]);

/* ================================================================ state */
const state = {
  events: [], byId: new Map(),
  sessions: new Map(),
  registry: [], totalEvents: 0,
  paused: false, stick: true,
  filters: { session: "", app: "", type: "", q: "" },
  seenTypes: new Set(), seenApps: new Set(),
  view: "all",                 // "all" | session id
  sel: null,                   // {sid, tid}
};
const slots = new Array(CAT.length).fill(null);
const rateWin = [];
let lastHeartbeatMs = 0;

/* dirty flags — one rAF paint pass */
let paintScheduled = false;
let chipsDirty = true, boardRebuild = true, tickerDirty = true, inspectorDirty = false;
const dirtyTasks = new Set();      // task objects needing class/text refresh
const pendingAdds = [];            // tasks to incrementally add to the board
let logQueue = [];

const $ = (id) => document.getElementById(id);
const logEl = $("log"), tip = $("tip");

/* ================================================================ utils */
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shortId = (sid) => String(sid).slice(0, 8);
const fmtTime = (ms) => { const d = new Date(ms); return isNaN(d) ? "" : d.toTimeString().slice(0, 8); };
const compact = (n) => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e4 ? Math.round(n/1e3)+"K" : n >= 1e3 ? (n/1e3).toFixed(1)+"K" : String(n);
const fmtElapsed = (ms) => {
  const s = Math.max(0, Math.floor(ms / 1000));
  const hh = String(Math.floor(s / 3600)).padStart(2, "0");
  const mm = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
  const ss = String(s % 60).padStart(2, "0");
  return `T+${hh}:${mm}:${ss}`;
};
const STATUS_GLYPH = { pending: "·", in_progress: "▸", completed: "✓", deleted: "✕" };

function extractTaskId(r) {
  if (r == null) return null;
  if (typeof r === "object") {
    const c = r.task?.id ?? r.id ?? r.taskId ?? r.task_id;
    if (c != null) return String(c);
  }
  const s = typeof r === "string" ? r : JSON.stringify(r);
  const m = s.match(/task\s*#?\s*(\d+)/i) || s.match(/#(\d+)/);
  return m ? m[1] : null;
}

function allocSlot(sid) { const i = slots.indexOf(null); if (i >= 0) { slots[i] = sid; return i; } return -1; }
function freeSlot(sid) { const i = slots.indexOf(sid); if (i >= 0) slots[i] = null; }

function schedulePaint() { if (!paintScheduled) { paintScheduled = true; requestAnimationFrame(paint); } }

/* ================================================================ sessions */
function getSession(ev) {
  let s = state.sessions.get(ev.session_id);
  if (!s) {
    const slot = allocSlot(ev.session_id);
    s = {
      id: ev.session_id, app: ev.source_app, slot,
      color: slot >= 0 ? CAT[slot] : OVERFLOW,
      firstMs: ev._ms, lastMs: ev._ms, count: 0,
      ended: false, endedMs: 0, evicted: false,
      agents: new Map(), pending: new Map(), attention: 0, transcriptPath: null,
      tasks: new Map(), taskSeq: 0, activeTaskId: null, activeLog: [],
      lastPromptMs: 0, lastStopMs: 0, hasDeps: false,
      tierCounts: [],           // tasks per tier (slot assignment)
      _chipEl: null,
    };
    state.sessions.set(ev.session_id, s);
    chipsDirty = true;
    if (state.view === "all") boardRebuild = true;   // new swimlane band
    refreshSelect("fSession");
  }
  return s;
}

function evict(s) {
  if (s.evicted) return;
  if (s.tasks.size > 0) return;          // task boards are never evicted — chip dims instead
  s.evicted = true;
  freeSlot(s.id);
  chipsDirty = true;
  if (state.view === s.id) { state.view = "all"; boardRebuild = true; }
  else if (state.view === "all") boardRebuild = true;
}

function reapAgents(s) {
  for (const a of s.agents.values()) {
    if (a.running > 0) { a.running = 0; a.done += 1; a._stale = false; }
  }
}

/* ================================================================ task reducer */
function taskUpsert(s, id, fields, ev, src) {
  let t = s.tasks.get(id);
  const isNew = !t;
  if (isNew) {
    const seq = s.taskSeq++;
    t = {
      id, sid: s.id, subject: "", description: "", activeForm: "",
      status: "pending", isRule: false, blockedBy: new Set(),
      provisional: false, stub: false, seq,
      createdMs: ev._ms, createdEvId: ev.id, startedMs: 0, doneMs: 0,
      history: [], lastStatusEvId: 0,
      tier: -1, slot: -1, _el: null,
    };
    s.tasks.set(id, t);
  }
  if (fields.subject != null && fields.subject !== "") {
    t.subject = String(fields.subject);
    t.isRule = /^\s*(\[(RULE|COMPLIANCE)\]|RULE:)/i.test(t.subject);
    if (t.stub) t.stub = false;
  }
  if (fields.description != null) t.description = String(fields.description);
  if (fields.activeForm != null) t.activeForm = String(fields.activeForm);
  if (fields.provisional) t.provisional = true;
  if (fields.stub) t.stub = true;
  if (fields.blockedBy) {
    for (const dep of fields.blockedBy) t.blockedBy.add(String(dep));
    if (t.blockedBy.size) s.hasDeps = true;
  }
  if (fields.status && fields.status !== t.status && ev.id > t.lastStatusEvId) {
    t.status = fields.status;
    t.lastStatusEvId = ev.id;
    t.history.push({ status: fields.status, evId: ev.id, ms: ev._ms, src });
    if (fields.status === "in_progress") {
      t.startedMs = t.startedMs || ev._ms;
      s.activeTaskId = id;
      s.activeLog.push({ ms: ev._ms, taskId: id });
    }
    if (fields.status === "completed" || fields.status === "deleted") {
      t.doneMs = ev._ms;
      if (s.activeTaskId === id) s.activeTaskId = null;
    }
    tickerDirty = true;
    if (state.sel && state.sel.sid === s.id && state.sel.tid === id) inspectorDirty = true;
  }
  if (isNew) {
    assignTierSlot(s, t);
    pendingAdds.push(t);
    if (s.tasks.size === 1) boardRebuild = true;   // session's first task — its band must be created
    if (t.isRule) tickerDirty = true;
    chipsDirty = true;   // task counts on chips
  } else {
    dirtyTasks.add(t);
  }
  if (fields.status === "deleted") { removeTaskNode(t); s.tasks.delete(id); boardRebuild = true; }
  return t;
}

function assignTierSlot(s, t) {
  let tier;
  const known = [...t.blockedBy].map(d => s.tasks.get(d)).filter(Boolean);
  if (known.length) tier = 1 + Math.max(...known.map(d => Math.max(0, d.tier)));
  else tier = Math.floor(t.seq / layoutCols());
  t.tier = tier;
  s.tierCounts[tier] = (s.tierCounts[tier] || 0) + 1;
  t.slot = s.tierCounts[tier] - 1;
}

function activeTaskAt(s, ms) {
  for (let i = s.activeLog.length - 1; i >= 0; i--) {
    if (s.activeLog[i].ms <= ms) return s.activeLog[i].taskId;
  }
  return null;
}

function handleTaskTool(s, ev) {
  const p = ev.payload || {};
  const ti = p.tool_input || {};
  const tr = p.tool_response;
  switch (p.tool_name) {
    case "TaskCreate": {
      if (ev.hook_event_name !== "PostToolUse") return;
      let id = extractTaskId(tr);
      let provisional = false;
      if (id == null) { id = String(s.taskSeq + 1); provisional = true; }
      taskUpsert(s, id, {
        subject: ti.subject ?? tr?.task?.subject, description: ti.description,
        activeForm: ti.activeForm, status: "pending", provisional,
      }, ev, "create");
      break;
    }
    case "TaskUpdate": {
      if (ev.hook_event_name !== "PostToolUse") return;
      if (tr && typeof tr === "object" && tr.success === false) return;
      const id = String(ti.taskId ?? extractTaskId(tr) ?? "");
      if (!id) return;
      if (!s.tasks.has(id)) {
        taskUpsert(s, id, { subject: `TASK ${id} (unseen create)`, stub: true }, ev, "update");
      }
      taskUpsert(s, id, {
        status: ti.status, subject: ti.subject, description: ti.description,
        activeForm: ti.activeForm, blockedBy: ti.addBlockedBy,
      }, ev, "update");
      break;
    }
    case "TaskList": case "TaskGet": {
      if (ev.hook_event_name !== "PostToolUse") return;
      let list = null;
      if (Array.isArray(tr)) list = tr;
      else if (tr && Array.isArray(tr.tasks)) list = tr.tasks;
      else if (tr && tr.task && typeof tr.task === "object") list = [tr.task];
      if (!list) return;
      for (const item of list) {
        const id = item && (item.id ?? item.taskId ?? item.task_id);
        if (id == null) continue;
        // rebind a provisional task whose guessed id was wrong, by exact subject
        if (!s.tasks.has(String(id)) && item.subject) {
          for (const [k, t] of s.tasks) {
            if (t.provisional && t.subject === item.subject) {
              s.tasks.delete(k); t.id = String(id); t.provisional = false; s.tasks.set(t.id, t);
              dirtyTasks.add(t); break;
            }
          }
        }
        taskUpsert(s, String(id), {
          subject: item.subject, status: item.status,
          blockedBy: item.blockedBy, description: item.description,
        }, ev, "list");
      }
      break;
    }
  }
}

/* ================================================================ ingest */
function ingest(ev, quiet) {
  if (state.byId.has(ev.id)) return;                       // resurrect replay overlap
  ev._ms = Date.parse(ev.timestamp) || Date.now();
  const p = ev.payload || {};
  const t = ev.hook_event_name;
  const ti = p.tool_input || {};
  ev._search = `${ev.source_app} ${ev.session_id} ${t} ${p.tool_name || ""} ${p.agent_type || ""} ${p.task_subject || ""} ${ti.subject || ""} ${ti.command || ""} ${ti.file_path || ""} ${ti.description || ""} ${ti.pattern || ""} ${p.prompt || ""} ${p.message || ""}`.toLowerCase();

  state.events.push(ev);
  state.byId.set(ev.id, ev);
  if (state.events.length > 3000) {
    for (const d of state.events.splice(0, state.events.length - 3000)) state.byId.delete(d.id);
  }
  if (!state.seenTypes.has(t)) { state.seenTypes.add(t); refreshSelect("fType"); }
  if (!state.seenApps.has(ev.source_app)) { state.seenApps.add(ev.source_app); refreshSelect("fApp"); }
  if (!quiet) rateWin.push(ev._ms);

  if (NODELESS.has(t)) {
    if (t === "ForgeBuild") tickerDirty = true;
    if (!quiet) { queueLogRow(ev); schedulePaint(); }
    return;
  }

  const s = getSession(ev);
  s.count++; s.lastMs = Math.max(s.lastMs, ev._ms);
  if (ev.source_app && ev.source_app !== "unknown") s.app = ev.source_app;
  if (p.transcript_path) s.transcriptPath = p.transcript_path;

  switch (t) {
    case "SessionStart":
      if (s.ended) { s.ended = false; s.endedMs = 0; chipsDirty = true; }
      if (s.evicted) { s.evicted = false; s.slot = allocSlot(s.id); s.color = s.slot >= 0 ? CAT[s.slot] : OVERFLOW; chipsDirty = true; boardRebuild = true; }
      if (p.source === "clear" || p.source === "resume") {
        for (const other of state.sessions.values()) {
          if (other.id !== s.id && other.app === s.app && other.ended && !other.evicted) evict(other);
        }
      }
      break;
    case "SessionEnd":
      s.ended = true; s.endedMs = ev._ms; s.lastStopMs = ev._ms;
      freeSlot(s.id);            // color recycles; chip keeps snapshot color, dims
      reapAgents(s); chipsDirty = true;
      break;
    case "Stop":
      s.lastStopMs = ev._ms;
      reapAgents(s); s.pending.clear();
      if (s.attention) { s.attention = 0; chipsDirty = true; }
      break;
    case "UserPromptSubmit":
      s.lastPromptMs = ev._ms;
      if (s.attention) { s.attention = 0; chipsDirty = true; }
      break;
    case "SubagentStart": {
      const type = p.agent_type || "agent";
      const a = s.agents.get(type) || { type, running: 0, done: 0, lastStartMs: 0, _stale: false };
      a.running++; a.lastStartMs = ev._ms; s.agents.set(type, a);
      break;
    }
    case "SubagentStop": {
      const a = s.agents.get(p.agent_type || "agent");
      if (a && a.running > 0) { a.running--; a.done++; a._stale = false; }
      break;
    }
    case "PreToolUse": {
      if (!TASK_TOOLS.has(p.tool_name)) {
        const q = s.pending.get(p.tool_name) || [];
        q.push(ev._ms); if (q.length > 20) q.shift();
        s.pending.set(p.tool_name, q);
      }
      if (s.attention) { s.attention = 0; chipsDirty = true; }
      break;
    }
    case "PostToolUse":
    case "PostToolUseFailure": {
      if (TASK_TOOLS.has(p.tool_name)) { handleTaskTool(s, ev); }
      else {
        const q = s.pending.get(p.tool_name);
        if (q && q.length) ev._dur = ev._ms - q.shift();
        if (p.duration_ms != null) ev._dur = p.duration_ms;
      }
      if (s.attention) { s.attention = 0; chipsDirty = true; }
      break;
    }
    case "PermissionRequest":
    case "Notification":
      s.attention++; chipsDirty = true; tickerDirty = true;
      break;
    case "TaskCreated":
      if (p.task_id != null) taskUpsert(s, String(p.task_id), { subject: p.task_subject ?? p.subject ?? p.title, status: "pending" }, ev, "hook");
      break;
    case "TaskCompleted":
      if (p.task_id != null) {
        if (!s.tasks.has(String(p.task_id))) taskUpsert(s, String(p.task_id), { subject: p.task_subject ?? `TASK ${p.task_id}`, stub: !p.task_subject }, ev, "hook");
        taskUpsert(s, String(p.task_id), { status: "completed", subject: p.task_subject }, ev, "hook");
      }
      break;
  }

  if (!quiet) {
    queueLogRow(ev);
    // live-append related event to open inspector
    if (state.sel && state.sel.sid === s.id && !TASK_TOOLS.has(p.tool_name)) {
      const selT = s.tasks.get(state.sel.tid);
      if (selT && selT.status === "in_progress" && s.activeTaskId === selT.id) inspectorDirty = true;
    }
    schedulePaint();
  }
}

/* ================================================================ log */
function summarize(ev) {
  const p = ev.payload || {};
  const t = ev.hook_event_name;
  const ti = p.tool_input || {};
  const brief = ti.command || ti.file_path || ti.description || ti.pattern || ti.prompt || ti.url || "";
  const dur = ev._dur != null ? ` <span class="dim">· ${(ev._dur/1000).toFixed(1)}s</span>` : "";
  switch (t) {
    case "PreToolUse":
      if (p.tool_name === "TaskCreate") return `+ task <span class="dim">${esc(String(ti.subject || "").slice(0, 90))}</span>`;
      if (p.tool_name === "TaskUpdate") return `task #${esc(ti.taskId || "?")} <span class="dim">${esc(ti.status || "update")}</span>`;
      return `<b>${esc(p.tool_name || "tool")}</b> <span class="dim">${esc(String(brief).slice(0,110))}</span>`;
    case "PostToolUse":
      if (p.tool_name === "TaskCreate") { const id = extractTaskId(p.tool_response); return `wired in task #${esc(id ?? "?")} <span class="dim">${esc(String(ti.subject || "").slice(0, 80))}</span>`; }
      if (p.tool_name === "TaskUpdate") return `task #${esc(ti.taskId || "?")} → <b>${esc(ti.status || "updated")}</b>`;
      if (p.tool_name === "TaskList" || p.tool_name === "TaskGet") return `<span class="dim">${esc(p.tool_name)} reconcile</span>`;
      return `<b>${esc(p.tool_name || "tool")}</b> <span class="dim">${esc(String(brief).slice(0,100))}</span>${dur}`;
    case "PostToolUseFailure": {
      const r = typeof p.tool_response === "string" ? p.tool_response : JSON.stringify(p.tool_response || p.error || "");
      return `<b>${esc(p.tool_name || "tool")}</b> <span class="dim">failed — ${esc(String(r).slice(0,90))}</span>${dur}`;
    }
    case "UserPromptSubmit":  return `“${esc(String(p.prompt || "").slice(0,120))}”`;
    case "Notification":      return esc(String(p.message || "").slice(0,120));
    case "PermissionRequest": return `waiting for permission: <b>${esc(p.tool_name || "?")}</b>`;
    case "SubagentStart":     return `spawned <b>${esc(p.agent_type || "agent")}</b>`;
    case "SubagentStop":      return `<b>${esc(p.agent_type || "agent")}</b> finished`;
    case "SessionStart":      return `session started <span class="dim">(${esc(p.source || "startup")})</span>`;
    case "SessionEnd":        return `session ended <span class="dim">(${esc(p.reason || "")})</span>`;
    case "Stop":              return `turn completed`;
    case "PreCompact":        return `compacting context…`;
    case "TaskCreated":       return `task #${esc(p.task_id ?? "?")} created <span class="dim">${esc(String(p.task_subject || "").slice(0, 80))}</span>`;
    case "TaskCompleted":     return `task #${esc(p.task_id ?? "?")} <b>verified ✓</b> <span class="dim">${esc(String(p.task_subject || "").slice(0, 70))}</span>`;
    case "ForgeBuild":        return `⚒ forged <b>${esc(p.name || "capability")}</b> <span class="dim">(${esc(p.type || "")})</span>`;
    default:                  return `<span class="dim">${esc(JSON.stringify(p).slice(0,110))}</span>`;
  }
}

function badgeCls(ev) {
  const t = ev.hook_event_name;
  if (t === "PostToolUseFailure") return "badge fail";
  if (t === "PermissionRequest" || t === "Notification") return "badge attn";
  if (t === "ForgeBuild") return "badge forge";
  if (t === "TaskCreated" || t === "TaskCompleted" || TASK_TOOLS.has((ev.payload || {}).tool_name)) return "badge task";
  return "badge";
}
function badgeLabel(t) { return t === "PostToolUseFailure" ? "✕ FAIL" : t.replace(/([a-z])([A-Z])/g, "$1·$2"); }

function rowMatches(ev) {
  const f = state.filters;
  return (!f.session || ev.session_id === f.session)
      && (!f.app || ev.source_app === f.app)
      && (!f.type || ev.hook_event_name === f.type)
      && (!f.q || ev._search.includes(f.q));
}

function colorOfSid(sid) { const s = state.sessions.get(sid); return s ? s.color : OVERFLOW; }

function buildRow(ev, fresh) {
  const div = document.createElement("div");
  div.className = fresh ? "row fresh" : "row";
  div.dataset.id = ev.id;
  div.innerHTML =
    `<span class="t">${fmtTime(ev._ms)}</span>` +
    `<span class="who"><span class="sdot" style="background:${colorOfSid(ev.session_id)}"></span>` +
      `<span class="app">${esc(ev.source_app)}</span></span>` +
    `<span class="what"><span class="${badgeCls(ev)}">${esc(badgeLabel(ev.hook_event_name))}</span>` +
      `<span class="msg">→ ${summarize(ev)}</span></span>`;
  return div;
}

function queueLogRow(ev) {
  if (state.paused || !rowMatches(ev)) return;
  logQueue.push(ev);
}
function flushLog() {
  if (!logQueue.length) return;
  const frag = document.createDocumentFragment();
  for (const ev of logQueue) frag.appendChild(buildRow(ev, true));
  logQueue = [];
  logEl.appendChild(frag);
  while (logEl.children.length > 500) logEl.removeChild(logEl.firstChild);
  if (state.stick) logEl.scrollTop = logEl.scrollHeight;
}
function rebuildLog() {
  logQueue = [];
  logEl.innerHTML = "";
  const frag = document.createDocumentFragment();
  for (const ev of state.events.filter(rowMatches).slice(-500)) frag.appendChild(buildRow(ev, false));
  logEl.appendChild(frag);
  logEl.scrollTop = logEl.scrollHeight;
}

function refreshSelect(id) {
  const sel = $(id);
  if (!sel || document.activeElement === sel) return;
  const cur = sel.value;
  if (id === "fSession") {
    sel.innerHTML = `<option value="">ALL SESSIONS</option>` +
      [...state.sessions.values()].map(s =>
        `<option value="${esc(s.id)}">${esc(s.app)} · ${esc(shortId(s.id))}${s.ended ? " · ended" : ""}</option>`).join("");
  } else if (id === "fApp") {
    sel.innerHTML = `<option value="">ALL APPS</option>` + [...state.seenApps].sort().map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join("");
  } else if (id === "fType") {
    sel.innerHTML = `<option value="">ALL EVENTS</option>` + [...state.seenTypes].sort().map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
  }
  sel.value = cur;
}

/* ================================================================ board layout */
let NODE_W = 150, NODE_H = 40, GAP_X = 14, GAP_Y = 18, PAD = 24, BAND_HEAD = 26;
let compactMode = false;

function layoutCols() {
  const w = $("board").clientWidth || 1200;
  NODE_W = w <= 1300 ? 132 : 150;
  return Math.max(4, Math.min(12, Math.floor((w - PAD * 2) / (NODE_W + GAP_X))));
}

function visibleSessions() {
  return [...state.sessions.values()]
    .filter(s => !s.evicted && (state.view === "all" ? true : s.id === state.view))
    .sort((a, b) => a.firstMs - b.firstMs);
}

/* compute pixel positions; returns {positions Map(task->xy), bands:[…], width, height} */
function computeLayout() {
  const cols = layoutCols();
  const nodeH = compactMode ? 26 : NODE_H;
  const pitchY = nodeH + GAP_Y;
  const all = visibleSessions();
  const sessions = all.filter(s => s.tasks.size > 0);
  const freeform = state.view === "all" ? all.filter(s => s.tasks.size === 0 && !s.ended) : [];
  const positions = new Map(), bands = [];
  let y = 16;
  const maxRowsPerBand = state.view === "all" ? 3 : Infinity;

  for (const s of sessions) {
    const tasks = [...s.tasks.values()].sort((a, b) => (a.tier - b.tier) || (a.slot - b.slot) || (a.seq - b.seq));
    // group into pixel rows: tier by tier, wrapping tiers wider than cols
    const rows = [];
    let curTier = -1, rowBuf = null;
    for (const t of tasks) {
      if (t.tier !== curTier || rowBuf.length >= cols) {
        if (t.tier !== curTier || rowBuf.length >= cols) { rowBuf = []; rows.push({ tier: t.tier, items: rowBuf }); }
        curTier = t.tier;
      }
      rowBuf.push(t);
    }
    const bandTop = y;
    if (state.view === "all") y += BAND_HEAD;
    const shownRows = rows.slice(0, maxRowsPerBand);
    let hidden = 0;
    for (const r of rows.slice(maxRowsPerBand)) hidden += r.items.length;
    shownRows.forEach((row, ri) => {
      row.items.forEach((t, ci) => {
        positions.set(t, { x: PAD + ci * (NODE_W + GAP_X), y: y + ri * pitchY });
      });
    });
    y += shownRows.length * pitchY;
    bands.push({ s, top: bandTop, hidden, moreY: y });
    if (hidden > 0) y += 30;
    y += state.view === "all" ? 18 : 8;
  }
  for (const s of freeform) {
    bands.push({ s, top: y, hidden: 0, moreY: y, freeform: true });
    y += BAND_HEAD + 10;
  }
  return { positions, bands, hasTaskNodes: positions.size > 0 || sessions.length > 0, height: Math.max(y + 20, $("board").clientHeight), nodeH };
}

function nodeClass(t) {
  let c = `tnode st-${t.status}`;
  if (t.isRule) c += " rule";
  if (t.stub) c += " stubbed";
  if (compactMode) c += " compact";
  if (state.sel && state.sel.sid === t.sid && state.sel.tid === t.id) c += " sel";
  return c;
}

function nodeGlyph(t) { return t.isRule && t.status === "pending" ? "◇" : (STATUS_GLYPH[t.status] || "·"); }

function fillNodeEl(el, t) {
  el.className = nodeClass(t);
  el.style.width = NODE_W + "px";
  el.style.borderLeftColor = colorOfSid(t.sid);
  el.dataset.sid = t.sid; el.dataset.tid = t.id;
  el.innerHTML = `<span class="tglyph">${nodeGlyph(t)}</span><span class="tidx">${esc(String(t.id).padStart(2, "0"))}</span><div class="tsub">${esc(t.subject.replace(/^\s*\[(RULE|COMPLIANCE)\]\s*/i, "").replace(/^\s*RULE:\s*/i, ""))}</div>`;
}

function edgeKey(a, b) { return `e:${a.sid}:${a.id}:${b.id}`; }
function edgePath(p1, p2, nodeH) {
  const x1 = p1.x + NODE_W / 2, y1 = p1.y + nodeH;
  const x2 = p2.x + NODE_W / 2, y2 = p2.y;
  const midY = y1 + Math.max(6, (y2 - y1) / 2);
  return `M${x1},${y1} V${midY} H${x2} V${y2}`;
}

function rebuildBoard() {
  const inner = $("boardInner"), edges = $("edges");
  // clear node elements (keep #edges + #boardEmpty)
  for (const el of [...inner.querySelectorAll(".tnode, .band-header, .more-chip")]) el.remove();
  edges.innerHTML = "";

  const { positions, bands, height, nodeH } = computeLayout();
  const anyTasks = bands.length > 0;
  $("boardEmpty").style.display = anyTasks ? "none" : "flex";
  if (!anyTasks && state.view !== "all") {
    $("boardEmpty").innerHTML = `<div class="big">NO TASKS IN THIS SESSION</div><div>agent running freeform</div><div class="hint">/forge-plan &lt;goal&gt; fills this board with a build pipeline</div>`;
  } else if (!anyTasks) {
    $("boardEmpty").innerHTML = `<div class="big">AWAITING AGENTS…</div><div>machine-wide hooks armed · run claude in any project</div><div class="hint">tip: /forge-plan &lt;goal&gt; fills this board with a build pipeline</div>`;
  }
  const w = $("board").clientWidth;
  inner.style.height = height + "px";
  edges.setAttribute("width", w); edges.setAttribute("height", height);
  edges.setAttribute("viewBox", `0 0 ${w} ${height}`);

  const frag = document.createDocumentFragment();
  let edgeHtml = "";
  for (const band of bands) {
    const s = band.s;
    if (state.view === "all") {
      const h = document.createElement("div");
      h.className = "band-header"; h.dataset.sid = s.id;
      if (band.freeform) h.style.opacity = ".55";
      h.style.left = PAD + "px"; h.style.top = band.top + "px"; h.style.width = `calc(100% - ${PAD * 2}px)`;
      const meta = band.freeform
        ? `${shortId(s.id)} · freeform — no task pipeline · /forge-plan to build one`
        : `${shortId(s.id)} · ${s.tasks.size} tasks · ${[...s.tasks.values()].filter(t => t.status === "completed").length} done${s.ended ? " · ended" : ""}`;
      h.innerHTML = `<span class="bar" style="background:${s.color}"></span>${esc(s.app)} <span class="meta">${esc(meta)}</span>`;
      frag.appendChild(h);
    }
    if (band.freeform) continue;
    if (band.hidden > 0) {
      const m = document.createElement("div");
      m.className = "more-chip"; m.dataset.sid = s.id;
      m.style.left = PAD + "px"; m.style.top = band.moreY + "px";
      m.style.width = NODE_W + "px"; m.style.height = "22px";
      m.textContent = `+${band.hidden} MORE ▸`;
      frag.appendChild(m);
    }
    // nodes + edges for this session
    const chain = [];
    for (const [t, pos] of positions) {
      if (t.sid !== s.id) continue;
      const el = document.createElement("div");
      fillNodeEl(el, t);
      el.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
      el.style.transition = "none";               // no slide-in on rebuild
      t._el = el;
      frag.appendChild(el);
      chain.push(t);
      for (const depId of t.blockedBy) {
        const dep = s.tasks.get(depId);
        const dp = dep && positions.get(dep);
        if (dp) edgeHtml += `<path class="dep" data-key="${esc(edgeKey(dep, t))}" data-to="${esc(t.sid)}:${esc(t.id)}" d="${edgePath(dp, positions.get(t), nodeH)}"/>`;
      }
    }
    if (!s.hasDeps && chain.length > 1) {
      chain.sort((a, b) => a.seq - b.seq);
      for (let i = 0; i < chain.length - 1; i++) {
        const p1 = positions.get(chain[i]), p2 = positions.get(chain[i + 1]);
        if (p1.y === p2.y) continue;               // same row — skip horizontal clutter
        edgeHtml += `<path class="chain" d="${edgePath(p1, p2, nodeH)}"/>`;
      }
    }
  }
  edges.innerHTML = edgeHtml;
  inner.appendChild(frag);
  requestAnimationFrame(() => { for (const s of state.sessions.values()) for (const t of s.tasks.values()) if (t._el) t._el.style.transition = ""; });
  boardRebuild = false;
  pendingAdds.length = 0;
  restrokeSelEdges();
}

function applyAdds() {
  // Incremental pass: recompute layout, SYNC every visible node's transform
  // (bands below a grown band shift — transform changes don't restart CSS
  // animations, so sliding existing nodes is safe), create missing elements,
  // and rebuild the edge layer wholesale (pure paths, nothing animated inside).
  const { positions, bands, height, nodeH } = computeLayout();
  const inner = $("boardInner"), edges = $("edges");
  $("boardEmpty").style.display = bands.length > 0 ? "none" : "flex";
  inner.style.height = height + "px";
  const w = $("board").clientWidth;
  edges.setAttribute("height", height); edges.setAttribute("viewBox", `0 0 ${w} ${height}`);

  const frag = document.createDocumentFragment();
  for (const [t, pos] of positions) {
    const tf = `translate(${pos.x}px, ${pos.y}px)`;
    if (t._el && t._el.isConnected) {
      if (t._el.style.transform !== tf) t._el.style.transform = tf;
    } else {
      const el = document.createElement("div");
      fillNodeEl(el, t);
      el.style.transform = tf;
      t._el = el;
      frag.appendChild(el);
    }
  }
  inner.appendChild(frag);

  let edgeHtml = "";
  for (const band of bands) {
    if (band.freeform) continue;
    const s = band.s, chain = [];
    for (const [t, pos] of positions) {
      if (t.sid !== s.id) continue;
      chain.push(t);
      for (const depId of t.blockedBy) {
        const dep = s.tasks.get(depId);
        const dp = dep && positions.get(dep);
        if (dp) edgeHtml += `<path class="dep" data-to="${esc(t.sid)}:${esc(t.id)}" d="${edgePath(dp, pos, nodeH)}"/>`;
      }
    }
    if (!s.hasDeps && chain.length > 1) {
      chain.sort((a, b) => a.seq - b.seq);
      for (let i = 0; i < chain.length - 1; i++) {
        const p1 = positions.get(chain[i]), p2 = positions.get(chain[i + 1]);
        if (p1.y === p2.y) continue;
        edgeHtml += `<path class="chain" d="${edgePath(p1, p2, nodeH)}"/>`;
      }
    }
  }
  edges.innerHTML = edgeHtml;
  restrokeSelEdges();

  // nodes that fell behind a "+N MORE" cap lose their position — drop them
  for (const band of bands) {
    if (band.freeform || !band.hidden) continue;
    for (const t of band.s.tasks.values()) {
      if (t._el && t._el.isConnected && !positions.has(t)) removeTaskNode(t);
    }
  }

  // band headers / +N MORE chips: sync position + counts
  for (const band of bands) {
    const h = $("boardInner").querySelector(`.band-header[data-sid="${CSS.escape(band.s.id)}"]`);
    if (!h) { boardRebuild = true; schedulePaint(); continue; }   // new band appeared — needs a full pass
    h.style.top = band.top + "px";
    const meta = h.querySelector(".meta");
    if (meta && !band.freeform) meta.textContent = `${shortId(band.s.id)} · ${band.s.tasks.size} tasks · ${[...band.s.tasks.values()].filter(t => t.status === "completed").length} done${band.s.ended ? " · ended" : ""}`;
    const m = $("boardInner").querySelector(`.more-chip[data-sid="${CSS.escape(band.s.id)}"]`);
    if (m) {
      if (band.hidden > 0) { m.textContent = `+${band.hidden} MORE ▸`; m.style.top = band.moreY + "px"; }
      else m.remove();
    } else if (band.hidden > 0) { boardRebuild = true; schedulePaint(); }
  }
  pendingAdds.length = 0;

  const wantCompact = positions.size > 48;
  if (wantCompact !== compactMode) { compactMode = wantCompact; boardRebuild = true; schedulePaint(); }
}

function removeTaskNode(t) { if (t._el) { t._el.remove(); t._el = null; } }

function updateNodeEl(t) {
  if (!t._el || !t._el.isConnected) return;
  t._el.className = nodeClass(t);
  t._el.querySelector(".tglyph").textContent = nodeGlyph(t);
  const sub = t._el.querySelector(".tsub");
  const cleaned = t.subject.replace(/^\s*\[(RULE|COMPLIANCE)\]\s*/i, "").replace(/^\s*RULE:\s*/i, "");
  if (sub.textContent !== cleaned) sub.textContent = cleaned;
}

function restrokeSelEdges() {
  for (const p of $("edges").querySelectorAll("path.selin")) p.classList.remove("selin");
  if (!state.sel) return;
  for (const p of $("edges").querySelectorAll(`path[data-to="${CSS.escape(state.sel.sid + ":" + state.sel.tid)}"]`)) p.classList.add("selin");
}

/* ================================================================ chips */
function sessionStatusGlyph(s) {
  if (s.ended) return "○";
  return (Date.now() - s.lastMs) < ACTIVE_MS ? "▸" : "◐";
}
function renderChips() {
  const el = $("chips");
  const sessions = [...state.sessions.values()].filter(s => !s.evicted).sort((a, b) => a.firstMs - b.firstMs);
  let html = `<span class="chip ${state.view === "all" ? "selected" : ""}" data-view="all">ALL <span class="sid">${sessions.length}</span></span>`;
  for (const s of sessions) {
    const doneN = [...s.tasks.values()].filter(t => t.status === "completed").length;
    html += `<span class="chip ${state.view === s.id ? "selected" : ""} ${s.ended ? "dim" : ""}" data-view="${esc(s.id)}">` +
      `<span class="cdot" style="background:${s.color}"></span>${esc(s.app)} <span class="sid">${esc(shortId(s.id))}</span>` +
      `<span class="st">${sessionStatusGlyph(s)}</span>` +
      (s.tasks.size ? `<span class="sid">${doneN}/${s.tasks.size}</span>` : "") +
      (s.attention ? `<span class="attn">!</span>` : "") + `</span>`;
  }
  for (const cap of state.registry) {
    html += `<span class="chip forgecap" title="${esc(cap.description || "")}">⚒ ${esc(cap.id)}</span>`;
  }
  el.innerHTML = html;
  chipsDirty = false;
}

/* ================================================================ inspector */
function findTask(sid, tid) { const s = state.sessions.get(sid); return s && s.tasks.get(tid); }

function relatedEvents(s, t) {
  const from = t.startedMs || t.createdMs, to = t.doneMs || Date.now();
  const out = [];
  for (let i = state.events.length - 1; i >= 0; i--) {
    const ev = state.events[i];
    if (ev._ms < from - 1500) break;
    if (ev.session_id !== s.id || ev._ms > to + 1500) continue;
    const tn = (ev.payload || {}).tool_name;
    if (TASK_TOOLS.has(tn)) continue;
    if (!/^(PostToolUse|PostToolUseFailure|SubagentStart|SubagentStop|PermissionRequest|Notification)$/.test(ev.hook_event_name)) continue;
    if (activeTaskAt(s, ev._ms) !== t.id) continue;
    out.push(ev);
  }
  return out.reverse();
}

function renderInspector() {
  inspectorDirty = false;
  const box = $("insp");
  if (!state.sel) { box.innerHTML = `<div class="empty">Select a node to inspect it.</div>`; return; }
  const s = state.sessions.get(state.sel.sid);
  const t = findTask(state.sel.sid, state.sel.tid);
  if (!s || !t) { box.innerHTML = `<div class="empty">Select a node to inspect it.</div>`; return; }

  const glyphColor = t.status === "in_progress" ? "var(--cyan)" : t.status === "completed" ? "var(--good)" : "var(--muted)";
  let html = `<div class="isub"><span class="tg" style="color:${glyphColor}">${nodeGlyph(t)}</span>${esc(t.subject)}` +
    (t.isRule ? `<span class="tag rule">RULE</span>` : "") +
    (t.provisional ? `<span class="tag">PROVISIONAL</span>` : "") +
    (t.stub ? `<span class="tag">STUB</span>` : "") + `</div>`;
  html += `<div class="irow"><span class="k">task</span><span class="v">#${esc(t.id)} · ${esc(t.status)}</span></div>`;
  html += `<div class="irow"><span class="k">session</span><span class="v"><span class="schip" data-selsid="${esc(s.id)}"><span class="cdot" style="background:${s.color}"></span>${esc(s.app)} · ${esc(shortId(s.id))}</span></span></div>`;
  if (t.description) html += `<div class="irow"><span class="k">brief</span><span class="v">${esc(t.description.slice(0, 400))}</span></div>`;
  if (t.activeForm) html += `<div class="irow"><span class="k">active</span><span class="v">${esc(t.activeForm)}</span></div>`;

  if (t.blockedBy.size) {
    html += `<div class="sect"><div class="st">Blocked by</div>`;
    for (const depId of t.blockedBy) {
      const dep = s.tasks.get(depId);
      html += `<span class="dep-chip" data-dep="${esc(depId)}">${dep ? nodeGlyph(dep) : "?"} #${esc(depId)}</span>`;
    }
    html += `</div>`;
  }

  if (t.history.length) {
    html += `<div class="sect"><div class="st">Status history</div>`;
    for (const h of t.history.slice(-8)) {
      html += `<div class="hrow" data-ev="${h.evId}"><span class="t">${fmtTime(h.ms)}</span><span>→ ${esc(h.status)}</span><span class="t">(${esc(h.src)})</span></div>`;
    }
    html += `</div>`;
  }

  const rel = relatedEvents(s, t);
  html += `<div class="sect"><div class="st">Related events · attributed by time window${rel.length > 30 ? ` (+${rel.length - 30} earlier)` : ""}</div>`;
  if (!rel.length) html += `<div class="irow"><span class="v" style="color:var(--muted)">none captured yet</span></div>`;
  for (const ev of rel.slice(-30)) {
    html += `<div class="erow" data-ev="${ev.id}"><span class="t">${fmtTime(ev._ms)}</span><span class="m">→ ${summarize(ev)}</span></div>`;
  }
  html += `</div>`;

  html += `<div class="foot"><button data-act="filterlog">FILTER LOG</button>` +
    (s.transcriptPath ? `<button data-act="transcript">TRANSCRIPT</button>` : "") + `</div>`;
  box.innerHTML = html;
}

function selectTask(sid, tid) {
  const prev = state.sel ? findTask(state.sel.sid, state.sel.tid) : null;
  state.sel = { sid, tid };
  if (prev) { dirtyTasks.add(prev); }
  const t = findTask(sid, tid);
  if (t) dirtyTasks.add(t);
  inspectorDirty = true;
  restrokeSelEdges();
  if (innerWidth <= 1100) { $("inspPanel").classList.add("open"); $("inspClose").style.display = ""; }
  schedulePaint();
}

/* ================================================================ topbar: LINE, timer, sparkline, counters */
function lineStateOf(s) {
  if (s.ended) return "off";
  if (s.attention > 0) return "waiting";
  const now = Date.now();
  const turnOpen = s.lastPromptMs > s.lastStopMs;
  let toolLive = false;
  for (const q of s.pending.values()) if (q.length && now - q[q.length - 1] < BUSY_TOOL_MS) { toolLive = true; break; }
  if (turnOpen || toolLive) return "busy";
  return "free";
}

function renderTopbar() {
  const pill = $("linePill");
  const sessions = [...state.sessions.values()].filter(s => !s.evicted);
  if (state.view !== "all") {
    const s = state.sessions.get(state.view);
    const st = s ? lineStateOf(s) : "off";
    pill.className = `pill ${st}`;
    pill.textContent = `LINE: ${st === "waiting" ? "WAITING !" : st.toUpperCase()}`;
    $("runTitle").textContent = s ? `${s.app} · ${shortId(s.id)}` : "—";
    const endMs = s && s.ended ? s.endedMs : Date.now();
    $("timer").textContent = s ? fmtElapsed(endMs - s.firstMs) : "T+00:00:00";
  } else {
    const counts = { busy: 0, waiting: 0, free: 0, off: 0 };
    for (const s of sessions) counts[lineStateOf(s)]++;
    const cls = counts.waiting ? "waiting" : counts.busy ? "busy" : counts.free ? "free" : "off";
    pill.className = `pill ${cls}`;
    const parts = [];
    if (counts.busy) parts.push(`${counts.busy} BUSY`);
    if (counts.waiting) parts.push(`${counts.waiting} WAITING`);
    if (counts.free) parts.push(`${counts.free} FREE`);
    pill.textContent = `LINE: ${parts.join(" · ") || "—"}`;
    $("runTitle").textContent = `ALL SESSIONS (${sessions.length})`;
    const live = sessions.filter(s => !s.ended);
    const anchor = live.length ? Math.min(...live.map(s => s.firstMs)) : 0;
    $("timer").textContent = anchor ? fmtElapsed(Date.now() - anchor) : "T+00:00:00";
  }

  let running = 0, attention = 0, tasksTotal = 0, tasksDone = 0;
  for (const s of sessions) {
    attention += s.attention;
    for (const a of s.agents.values()) running += a.running;
    tasksTotal += s.tasks.size;
    for (const t of s.tasks.values()) if (t.status === "completed") tasksDone++;
  }
  $("agentsPill").textContent = `AGENTS ${running}`;
  $("forgedPill").textContent = `FORGED ${state.registry.length}`;
  document.title = attention > 0 ? `(${attention}) FORGE — agent needs you` : "FORGE TERMINAL";

  // rate + sparkline
  const now = Date.now();
  while (rateWin.length && rateWin[0] < now - 60000) rateWin.shift();
  $("rateLbl").textContent = `${compact(rateWin.length)}/m`;
  const bins = new Array(32).fill(0);
  for (const ms of rateWin) {
    const b = Math.floor((now - ms) / (60000 / 32));
    if (b >= 0 && b < 32) bins[31 - b]++;
  }
  const max = Math.max(...bins, 1);
  const pts = bins.map((v, i) => `${(i * 96 / 31).toFixed(1)},${(18 - (v / max) * 15).toFixed(1)}`).join(" ");
  $("spark").innerHTML = `<polyline points="${pts}" fill="none" stroke="var(--seq)" stroke-width="1.2"/>`;
  return { tasksTotal, tasksDone, sessionsN: sessions.length };
}

/* ================================================================ ticker */
let tickerPending = null;
function buildTickerHtml(stats) {
  const segs = [];
  const scope = state.view === "all" ? [...state.sessions.values()].filter(s => !s.evicted) : [state.sessions.get(state.view)].filter(Boolean);
  const rules = [];
  for (const s of scope) for (const t of s.tasks.values()) if (t.isRule) rules.push(t);
  if (rules.length) {
    segs.push(rules.slice(0, 8).map(t => `<span class="rule">◇ ${esc(t.subject.replace(/^\s*\[(RULE|COMPLIANCE)\]\s*/i, ""))}${t.status === "completed" ? " ✓" : ""}</span>`).join(`<span class="sep">→</span>`));
  }
  const attn = state.events.filter(e => /^(Notification|PermissionRequest)$/.test(e.hook_event_name)).slice(-3);
  for (const ev of attn) {
    const p = ev.payload || {};
    segs.push(`<span class="warn">! ${esc(String(p.message || ("permission: " + (p.tool_name || ""))).slice(0, 90))}</span>`);
  }
  for (const cap of state.registry.slice(-4)) segs.push(`<span class="forged">⚒ forged: ${esc(cap.id)} (${esc(cap.type)})</span>`);
  segs.push(`${stats.sessionsN} SESSIONS · ${compact(rateWin.length)} EVT/MIN · ${stats.tasksTotal} TASKS · ${stats.tasksDone} DONE`);
  const content = segs.join(`<span class="sep">·</span>`);
  return `<span class="tickseg">${content}</span><span class="tickseg" aria-hidden="true">${content}</span>`;
}
function applyTicker(html) {
  const track = $("tickerTrack");
  track.innerHTML = html;
  const w = track.scrollWidth / 2;
  const fits = w <= $("ticker").clientWidth;
  track.classList.toggle("scroll", !fits);
  track.style.setProperty("--tickdur", `${Math.max(20, w / 70)}s`);
}
$("tickerTrack").addEventListener("animationiteration", () => {
  if (tickerPending) { applyTicker(tickerPending); tickerPending = null; }
});

/* ================================================================ modal (payload / registry / transcript) */
const overlay = $("overlay");
function openModal(title) { $("modalTitle").textContent = title; $("modalBody").innerHTML = ""; overlay.classList.add("open"); return $("modalBody"); }
function closeModal() { overlay.classList.remove("open"); }
$("modalClose").onclick = closeModal;
overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeModal(); $("inspPanel").classList.remove("open"); }
});

function openPayloadModal(evId) {
  const ev = state.byId.get(Number(evId));
  if (!ev) return;
  const body = openModal(`${ev.hook_event_name} · ${ev.source_app} · ${shortId(ev.session_id)} · ${fmtTime(ev._ms)}`);
  const pre = document.createElement("pre");
  const { _search, _ms, _dur, ...clean } = ev;
  pre.textContent = JSON.stringify(clean, null, 2);
  body.appendChild(pre);
}

function openRegistryModal() {
  const body = openModal(`Forged capabilities · ${state.registry.length}`);
  if (!state.registry.length) { body.innerHTML = `<div style="color:var(--muted)">Nothing forged yet — /forge-build creates capabilities, /forge-plan runs builds.</div>`; return; }
  body.innerHTML = state.registry.map(c =>
    `<div class="regrow"><span class="rid">⚒ ${esc(c.id)}</span><span class="rtype">${esc(c.type || "")}</span>` +
    `<span class="rdesc">${esc(c.description || "")}${c.invoke ? `<span class="inv">${esc(c.invoke)}</span>` : ""}</span></div>`).join("");
}

async function openTranscript(s) {
  if (!s || !s.transcriptPath) return;
  const body = openModal(`Transcript · ${s.app} · ${shortId(s.id)}`);
  body.innerHTML = `<div style="color:var(--muted)">Loading…</div>`;
  try {
    const res = await fetch(`/api/transcript?path=${encodeURIComponent(s.transcriptPath)}`);
    if (!res.ok) throw new Error((await res.json()).error || res.status);
    const data = await res.json();
    body.innerHTML = "";
    let shown = 0;
    for (const en of data.entries) {
      const role = en.type === "user" ? "user" : en.type === "assistant" ? "assistant" : null;
      if (!role || !en.message) continue;
      let text = "";
      const c = en.message.content;
      if (typeof c === "string") text = c;
      else if (Array.isArray(c)) text = c.filter(b => b.type === "text").map(b => b.text).join("\n");
      if (!text.trim()) continue;
      const div = document.createElement("div");
      div.className = `turn ${role}`;
      const r = document.createElement("div"); r.className = "role"; r.textContent = role.toUpperCase();
      const tx = document.createElement("div"); tx.className = "text"; tx.textContent = text.length > 4000 ? text.slice(0, 4000) + " …" : text;
      div.append(r, tx); body.appendChild(div);
      if (++shown >= 300) break;
    }
    if (!shown) body.innerHTML = `<div style="color:var(--muted)">No user/assistant text turns found in this transcript tail.</div>`;
  } catch (err) {
    body.innerHTML = `<div style="color:var(--muted)">Could not load transcript: ${esc(err.message)}</div>`;
  }
}

/* ================================================================ paint */
function paint() {
  paintScheduled = false;
  if (chipsDirty) renderChips();
  if (boardRebuild) rebuildBoard();
  else if (pendingAdds.length) applyAdds();
  if (dirtyTasks.size) { for (const t of dirtyTasks) updateNodeEl(t); dirtyTasks.clear(); }
  if (inspectorDirty) renderInspector();
  if (tickerDirty) {
    const stats = { sessionsN: [...state.sessions.values()].filter(s => !s.evicted).length, ...taskTotals() };
    const html = buildTickerHtml(stats);
    if ($("tickerTrack").classList.contains("scroll") && document.body.classList.contains("anim")) tickerPending = html;
    else applyTicker(html);
    tickerDirty = false;
  }
  flushLog();
}
function taskTotals() {
  let tasksTotal = 0, tasksDone = 0;
  for (const s of state.sessions.values()) {
    if (s.evicted) continue;
    tasksTotal += s.tasks.size;
    for (const t of s.tasks.values()) if (t.status === "completed") tasksDone++;
  }
  return { tasksTotal, tasksDone };
}

/* ================================================================ interaction wiring */
$("chips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip[data-view]");
  if (!chip) return;
  const v = chip.dataset.view;
  if (state.view === v) return;
  state.view = v;
  state.filters.session = v === "all" ? "" : v;
  $("fSession").value = state.filters.session;
  chipsDirty = true; boardRebuild = true; tickerDirty = true;
  rebuildLog(); schedulePaint();
});
$("chips").addEventListener("dblclick", (e) => {
  const chip = e.target.closest(".chip[data-view]");
  if (!chip || chip.dataset.view === "all") return;
  openTranscript(state.sessions.get(chip.dataset.view));
});

$("board").addEventListener("click", (e) => {
  const more = e.target.closest(".more-chip, .band-header");
  if (more) {
    state.view = more.dataset.sid;
    state.filters.session = more.dataset.sid;
    $("fSession").value = state.filters.session;
    chipsDirty = true; boardRebuild = true; tickerDirty = true;
    rebuildLog(); schedulePaint();
    return;
  }
  const node = e.target.closest(".tnode");
  if (node && node.dataset.tid) selectTask(node.dataset.sid, node.dataset.tid);
});

$("insp").addEventListener("click", (e) => {
  const dep = e.target.closest("[data-dep]");
  if (dep && state.sel) { const t = findTask(state.sel.sid, dep.dataset.dep); if (t) return selectTask(state.sel.sid, t.id); }
  const evRow = e.target.closest("[data-ev]");
  if (evRow) return openPayloadModal(evRow.dataset.ev);
  const sChip = e.target.closest("[data-selsid]");
  if (sChip) {
    state.view = sChip.dataset.selsid; state.filters.session = state.view;
    $("fSession").value = state.view;
    chipsDirty = true; boardRebuild = true; rebuildLog(); schedulePaint(); return;
  }
  const act = e.target.closest("[data-act]");
  if (act && state.sel) {
    const s = state.sessions.get(state.sel.sid);
    const t = findTask(state.sel.sid, state.sel.tid);
    if (act.dataset.act === "transcript") openTranscript(s);
    if (act.dataset.act === "filterlog" && t) {
      state.filters.session = s.id; $("fSession").value = s.id;
      $("fSearch").value = t.subject.slice(0, 40); state.filters.q = t.subject.slice(0, 40).toLowerCase();
      rebuildLog();
    }
  }
});
$("inspClose").onclick = () => $("inspPanel").classList.remove("open");

logEl.addEventListener("click", (e) => {
  const row = e.target.closest(".row");
  if (row) openPayloadModal(row.dataset.id);
});
logEl.addEventListener("scroll", () => {
  state.stick = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
});

$("fSession").onchange = (e) => { state.filters.session = e.target.value; rebuildLog(); };
$("fApp").onchange = (e) => { state.filters.app = e.target.value; rebuildLog(); };
$("fType").onchange = (e) => { state.filters.type = e.target.value; rebuildLog(); };
let searchTimer = null;
$("fSearch").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.filters.q = e.target.value.trim().toLowerCase(); rebuildLog(); }, 150);
});
$("btnClear").onclick = () => { logEl.innerHTML = ""; };
$("btnLive").onclick = () => {
  state.paused = !state.paused;
  const b = $("btnLive");
  b.classList.toggle("on", !state.paused);
  b.textContent = state.paused ? "❚❚ PAUSED" : "● LIVE";
  if (!state.paused) { rebuildLog(); state.stick = true; }
};
$("forgedPill").onclick = openRegistryModal;
$("fxPill").onclick = () => {
  const on = !document.body.classList.contains("fx");
  document.body.classList.toggle("fx", on);
  document.body.classList.toggle("anim", on);
  try { localStorage.setItem("forge-fx", on ? "1" : "0"); } catch {}
};
try { if (localStorage.getItem("forge-fx") === "0") { document.body.classList.remove("fx", "anim"); } } catch {}

/* scanline overlay sits over the board only */
function placeScan() {
  const r = $("board").getBoundingClientRect();
  const scan = $("scan");
  scan.style.left = r.left + "px"; scan.style.top = r.top + "px";
  scan.style.width = r.width + "px"; scan.style.height = r.height + "px";
}
addEventListener("resize", () => { placeScan(); boardRebuild = true; schedulePaint(); });

/* tooltip for chips + nodes (rAF-throttled) */
let lastMove = null, moveScheduled = false;
document.addEventListener("mousemove", (e) => {
  lastMove = e;
  if (!moveScheduled) { moveScheduled = true; requestAnimationFrame(processMove); }
});
function processMove() {
  moveScheduled = false;
  const e = lastMove; if (!e) return;
  const node = e.target.closest?.(".tnode[data-tid]");
  if (node) {
    const t = findTask(node.dataset.sid, node.dataset.tid);
    if (t) {
      tip.innerHTML = `<div style="color:var(--ink);margin-bottom:2px">${esc(t.subject)}</div>` +
        `<div>#${esc(t.id)} · ${esc(t.status)}${t.isRule ? " · ◇ rule" : ""}</div>` +
        (t.startedMs ? `<div style="color:var(--muted)">started ${fmtTime(t.startedMs)}${t.doneMs ? ` · done ${fmtTime(t.doneMs)}` : ""}</div>` : "");
      tip.style.display = "block";
      const r = tip.getBoundingClientRect();
      tip.style.left = Math.min(e.clientX + 12, innerWidth - r.width - 8) + "px";
      tip.style.top = Math.min(e.clientY + 12, innerHeight - r.height - 8) + "px";
      return;
    }
  }
  tip.style.display = "none";
}

/* ================================================================ SSE */
let es = null, resurrectTimer = null;
function connect() {
  if (es) { try { es.close(); } catch {} }
  es = new EventSource("/stream");
  es.addEventListener("init", (m) => {
    const data = JSON.parse(m.data);
    state.events = []; state.byId.clear(); state.sessions.clear();
    state.seenTypes.clear(); state.seenApps.clear();
    slots.fill(null); rateWin.length = 0; logQueue = [];
    dirtyTasks.clear(); pendingAdds.length = 0;
    state.registry = (data.registry && data.registry.capabilities) || [];
    state.totalEvents = (data.totals && data.totals.events) || (data.events || []).length;
    const cutoff = Date.now() - 60000;
    for (const ev of data.events || []) {
      ingest(ev, true);
      if (ev._ms > cutoff) rateWin.push(ev._ms);
    }
    rateWin.sort((a, b) => a - b);
    const want = new URLSearchParams(location.search).get("view");
    if (want) {
      for (const sid of state.sessions.keys()) {
        if (sid.startsWith(want)) { state.view = sid; state.filters.session = sid; break; }
      }
    }
    if (state.view !== "all" && !state.sessions.has(state.view)) state.view = "all";
    const wantSel = new URLSearchParams(location.search).get("sel");
    if (wantSel && state.view !== "all" && findTask(state.view, wantSel)) state.sel = { sid: state.view, tid: wantSel };
    if (state.sel && !findTask(state.sel.sid, state.sel.tid)) state.sel = null;
    $("livePill").className = "pill live"; $("liveTxt").textContent = "LIVE";
    refreshSelect("fSession"); refreshSelect("fApp"); refreshSelect("fType");
    chipsDirty = true; boardRebuild = true; tickerDirty = true; inspectorDirty = true;
    rebuildLog(); renderTopbar(); schedulePaint();
  });
  es.addEventListener("ev", (m) => {
    state.totalEvents++;
    ingest(JSON.parse(m.data), false);
  });
  es.addEventListener("registry", (m) => {
    state.registry = JSON.parse(m.data).capabilities || [];
    chipsDirty = true; tickerDirty = true; schedulePaint();
  });
  es.onerror = () => {
    $("livePill").className = "pill dead"; $("liveTxt").textContent = "RECONNECTING";
    if (es.readyState === 2) {
      clearTimeout(resurrectTimer);
      resurrectTimer = setTimeout(connect, 2000);
    }
  };
}

/* ================================================================ 1Hz tick */
setInterval(() => {
  const now = Date.now();
  for (const s of state.sessions.values()) {
    if (s.evicted) continue;
    if (s.ended && s.endedMs && s.tasks.size === 0 && now - s.endedMs > EVICT_MS) { evict(s); schedulePaint(); continue; }
    for (const a of s.agents.values()) if (a.running > 0 && !a._stale && now - a.lastStartMs > STALE_MS) a._stale = true;
  }
  const stats = renderTopbar();
  if (now - lastHeartbeatMs > 30000) { lastHeartbeatMs = now; tickerDirty = true; }
  // chip status glyphs go stale as sessions idle — cheap text refresh
  if (!chipsDirty) {
    for (const chip of $("chips").querySelectorAll(".chip[data-view]")) {
      const s = state.sessions.get(chip.dataset.view);
      if (!s) continue;
      const st = chip.querySelector(".st");
      if (st) { const g = sessionStatusGlyph(s); if (st.textContent !== g) st.textContent = g; }
    }
  }
  if (tickerDirty || chipsDirty || dirtyTasks.size || inspectorDirty) schedulePaint();
}, 1000);

placeScan();
connect();
</script>
</body>
